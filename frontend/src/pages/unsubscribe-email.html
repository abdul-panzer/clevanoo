<main id="main">
  <section class="page-hero tall">
    <div class="wrap">
      <h1 class="center reveal">Unsubscribe Email</h1>
      <form class="card contact-form reveal" method="post" data-email-type="unsubscribe">
        <div class="field">
          <label for="unsub-name">Name</label>
          <input class="input" id="unsub-name" name="name" autocomplete="name" maxlength="255" required>
        </div>
        <div class="field">
          <label for="unsub-email">Email</label>
          <input class="input" id="unsub-email" name="email" type="email" autocomplete="email" maxlength="255" required>
        </div>
        <div class="field">
          <label for="unsub-phone">Phone number</label>
          <input class="input" id="unsub-phone" name="phone" type="tel" autocomplete="tel" maxlength="30" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Unsubscribe</button>
        <p class="form-status" role="status" hidden></p>
      </form>
    </div>
  </section>
</main>
