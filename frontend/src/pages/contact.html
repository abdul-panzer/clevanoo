<main id="main">
  <section class="page-hero tall" data-scene="signal" data-dim="0.22">
    <div class="wrap">
      <h1 class="center reveal">Get in Touch</h1>
      <form class="card contact-form reveal" method="post" data-email-type="contact">
        <div class="field">
          <label for="cf-name">Your Name</label>
          <input class="input" id="cf-name" name="name" type="text" autocomplete="name" maxlength="255" required>
        </div>
        <div class="field">
          <label for="cf-email">Email</label>
          <input class="input" id="cf-email" name="email" type="email" autocomplete="email" maxlength="255" required>
        </div>
        <div class="field">
          <label for="cf-message">Message</label>
          <textarea class="input" id="cf-message" name="message" rows="5" maxlength="5000" required></textarea>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Send Message</button>
        <p class="form-status" role="status" hidden></p>
      </form>
    </div>
  </section>
</main>
